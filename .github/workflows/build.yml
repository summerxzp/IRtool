name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $ver = (Select-String -Path pyproject.toml -Pattern 'version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Install 7-Zip
        shell: pwsh
        run: choco install 7zip -y

      - name: Install build dependencies
        shell: pwsh
        run: pip install -r package/requirements-build.txt

      - name: Build with PyInstaller + 7z SFX
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File package/build-with-7z.ps1 -Mode onedir-7z

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRtool-v${{ steps.version.outputs.version }}
          path: package/dist/IRtool-v${{ steps.version.outputs.version }}-7z.exe
          retention-days: 7

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: package/dist/IRtool-v${{ steps.version.outputs.version }}-7z.exe

      - name: Upload to Gitee Release
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $tag = "v$ver"
          $file = "package/dist/IRtool-v$ver-7z.exe"
          $owner = "summerxzp"
          $repo = "irtool"

          if (-not $env:GITEE_TOKEN) {
            Write-Warning "GITEE_TOKEN is not configured. Skip Gitee upload."
            exit 0
          }

          function Get-ApiMsg {
            param($errRecord)
            $msg = ""
            if ($errRecord.ErrorDetails -and $errRecord.ErrorDetails.Message) {
              try {
                $json = $errRecord.ErrorDetails.Message | ConvertFrom-Json
                if ($json.message) { $msg = $json.message }
                elseif ($json.messages) { $msg = $json.messages -join ", " }
                else { $msg = $errRecord.ErrorDetails.Message }
              } catch {
                $msg = $errRecord.ErrorDetails.Message
              }
            }
            if (-not $msg) { $msg = $errRecord.Exception.Message }
            return $msg
          }

          # Ensure tag exists on Gitee (Gitee default branch is master)
          try {
            $tagBody = @{
              access_token = $env:GITEE_TOKEN
              refs         = "refs/heads/master"
              tag_name     = $tag
            }
            Invoke-RestMethod -Uri "https://gitee.com/api/v5/repos/$owner/$repo/tags" -Method Post -Body $tagBody -ContentType "application/x-www-form-urlencoded" -ErrorAction Stop
            Write-Host "Tag $tag created on Gitee"
          } catch {
            $errMsg = Get-ApiMsg $_
            Write-Host "Tag creation response: $errMsg"
            if ($errMsg -match "已经存在" -or $errMsg -match "已存在" -or $errMsg -match "already exist") {
              Write-Host "Tag $tag already exists on Gitee, continuing"
            } else {
              Write-Error "Failed to create tag: $errMsg"
              exit 1
            }
          }

          # Create or get existing release
          $releaseId = $null
          try {
            Write-Host "Creating Gitee release for $tag ..."
            $body = @{
              access_token     = $env:GITEE_TOKEN
              tag_name         = $tag
              name             = "IRtool $tag"
              body             = "Automated build from GitHub CI"
              target_commitish = "master"
            }
            $resp = Invoke-RestMethod -Uri "https://gitee.com/api/v5/repos/$owner/$repo/releases" -Method Post -Body $body -ContentType "application/x-www-form-urlencoded" -ErrorAction Stop
            $releaseId = $resp.id
            Write-Host "Gitee release created: $releaseId"
          } catch {
            $errMsg2 = Get-ApiMsg $_
            Write-Host "Release creation response: $errMsg2"
            if ($errMsg2 -match "已经存在" -or $errMsg2 -match "已存在" -or $errMsg2 -match "already exist") {
              Write-Host "Release for $tag already exists, fetching existing release ..."
              try {
                $existing = Invoke-RestMethod -Uri "https://gitee.com/api/v5/repos/$owner/$repo/releases/tags/$tag" -Method Get -Body @{ access_token = $env:GITEE_TOKEN } -ErrorAction Stop
                $releaseId = $existing.id
                Write-Host "Using existing release: $releaseId"
              } catch {
                $fetchErr = Get-ApiMsg $_
                Write-Error "Failed to fetch existing release for $tag : $fetchErr"
                exit 1
              }
            } else {
              Write-Error "Failed to create release: $errMsg2"
              exit 1
            }
          }

          if (-not $releaseId) {
            Write-Error "Could not obtain release ID"
            exit 1
          }

          # Upload file
          if (-not (Test-Path $file)) {
            Write-Error "Build artifact not found: $file"
            exit 1
          }
          $fileSize = [math]::Round((Get-Item $file).Length / 1MB, 2)
          Write-Host "Uploading $file ($fileSize MB) to Gitee release $releaseId ..."
          try {
            $uploadUrl = "https://gitee.com/api/v5/repos/$owner/$repo/releases/$releaseId/attach_files?access_token=$env:GITEE_TOKEN"
            $form = @{ file = Get-Item -Path $file }
            $uploadResp = Invoke-RestMethod -Uri $uploadUrl -Method Post -Form $form -TimeoutSec 600 -ErrorAction Stop
            Write-Host "File uploaded to Gitee: $($uploadResp.name)"
          } catch {
            $errMsg3 = Get-ApiMsg $_
            if ($errMsg3 -match "已经存在" -or $errMsg3 -match "已存在" -or $errMsg3 -match "already exist") {
              Write-Host "File already exists on Gitee release, skipping upload"
            } elseif ($errMsg3 -match "timeout" -or $errMsg3 -match "超时" -or $errMsg3 -match "timed out") {
              Write-Error "Upload timed out after 10 minutes (file size: $fileSize MB)"
              exit 1
            } else {
              Write-Error "Failed to upload file to Gitee: $errMsg3"
              exit 1
            }
          }
