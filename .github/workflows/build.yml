name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $ver = (Select-String -Path pyproject.toml -Pattern 'version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Install 7-Zip
        shell: pwsh
        run: choco install 7zip -y

      - name: Install build dependencies
        shell: pwsh
        run: pip install -r package/requirements-build.txt

      - name: Build with PyInstaller + 7z SFX
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File package/build-with-7z.ps1 -Mode onedir-7z

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRtool-v${{ steps.version.outputs.version }}
          path: package/dist/IRtool-v${{ steps.version.outputs.version }}-7z.exe
          retention-days: 7

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: package/dist/IRtool-v${{ steps.version.outputs.version }}-7z.exe

      - name: Upload to Gitee Release
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $tag = "v$ver"
          $file = "package/dist/IRtool-v$ver-7z.exe"
          $owner = "summerxzp"
          $repo = "irtool"

          if (-not $env:GITEE_TOKEN) {
            Write-Error "GITEE_TOKEN is not configured. Skip Gitee upload."
            exit 0
          }

          # Ensure tag exists on Gitee (Gitee default branch is master)
          try {
            $tagBody = @{
              access_token = $env:GITEE_TOKEN
              refs         = "refs/heads/master"
              tag_name     = $tag
            }
            Invoke-RestMethod -Uri "https://gitee.com/api/v5/repos/$owner/$repo/tags" -Method Post -Body $tagBody -ContentType "application/x-www-form-urlencoded" -ErrorAction Stop
            Write-Host "Tag $tag created on Gitee"
          } catch {
            $respStream = $_.Exception.Response
            $errBody = ""
            if ($respStream) {
              $reader = New-Object System.IO.StreamReader($respStream.GetResponseStream())
              $errBody = $reader.ReadToEnd()
              $reader.Close()
            }
            if ($errBody -match "已存在" -or $errBody -match "already exist") {
              Write-Host "Tag $tag already exists on Gitee, continuing"
            } else {
              Write-Error "Failed to create tag: $errBody"
              exit 1
            }
          }

          # Create or get existing release
          $releaseId = $null
          try {
            Write-Host "Creating Gitee release for $tag ..."
            $body = @{
              access_token     = $env:GITEE_TOKEN
              tag_name         = $tag
              name             = "IRtool $tag"
              body             = "Automated build from GitHub CI"
              target_commitish = "master"
            }
            $resp = Invoke-RestMethod -Uri "https://gitee.com/api/v5/repos/$owner/$repo/releases" -Method Post -Body $body -ContentType "application/x-www-form-urlencoded" -ErrorAction Stop
            $releaseId = $resp.id
            Write-Host "Gitee release created: $releaseId"
          } catch {
            $respStream2 = $_.Exception.Response
            $errBody2 = ""
            if ($respStream2) {
              $reader2 = New-Object System.IO.StreamReader($respStream2.GetResponseStream())
              $errBody2 = $reader2.ReadToEnd()
              $reader2.Close()
            }
            if ($errBody2 -match "已存在" -or $errBody2 -match "already exist") {
              Write-Host "Release for $tag already exists, fetching existing release ..."
              $existing = Invoke-RestMethod -Uri "https://gitee.com/api/v5/repos/$owner/$repo/releases/tags/$tag" -Method Get -Body @{ access_token = $env:GITEE_TOKEN }
              $releaseId = $existing.id
              Write-Host "Using existing release: $releaseId"
            } else {
              Write-Error "Failed to create release: $errBody2"
              exit 1
            }
          }

          if (-not $releaseId) {
            Write-Error "Could not obtain release ID"
            exit 1
          }

          # Upload file
          try {
            $uploadUrl = "https://gitee.com/api/v5/repos/$owner/$repo/releases/$releaseId/attach_files"
            $form = @{
              access_token = $env:GITEE_TOKEN
              file         = Get-Item -Path $file
            }
            $uploadResp = Invoke-RestMethod -Uri $uploadUrl -Method Post -Form $form -ErrorAction Stop
            Write-Host "File uploaded to Gitee: $($uploadResp.name)"
          } catch {
            Write-Error "Failed to upload file to Gitee: $($_.Exception.Message)"
            exit 1
          }
