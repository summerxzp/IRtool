[project]
name = "IRtool"
version = "1.1.7"
description = "Windows 终端应急响应桌面工具"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "summerxzp"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

dependencies = [
    "PyQt6>=6.11.0",
    "PyQt6-Qt6>=6.11.1",
    "PyQt6_sip>=13.11.1",
    "psutil>=7.2.0",
    "pywin32>=311",
    "pyzipper>=0.4.0",
    "requests>=2.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pyinstaller>=6.20.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
